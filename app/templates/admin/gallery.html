{% extends "base.html" %}

{% block title %}Gallery - Admin{% endblock %}

{% block content %}
<div class="min-h-screen bg-dark-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-dark-900">Gallery</h1>
                <p class="text-gray-600">Manage your gallery images</p>
            </div>
            <button onclick="document.getElementById('galleryUpload').click()" 
                    class="bg-gold-500 hover:bg-gold-600 text-dark-900 px-6 py-3 rounded-xl font-semibold transition-colors">
                <i class="fas fa-upload mr-2"></i>Upload Images
            </button>
            <input type="file" id="galleryUpload" accept="image/*" multiple class="hidden">
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {% for image in gallery_images %}
            <div class="relative group aspect-square bg-gray-100 rounded-xl overflow-hidden">
                <img src="{{ image.url }}" alt="{{ image.title }}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <button onclick="deleteImage('{{ image.id }}')" class="bg-red-500 text-white p-2 rounded-full">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            {% else %}
            <div class="col-span-4 text-center py-12 text-gray-500">No images in gallery</div>
            {% endfor %}
        </div>
    </div>
</div>
<script>
document.getElementById('galleryUpload').addEventListener('change', function() {
    const formData = new FormData();
    for (let file of this.files) {
        formData.append('gallery_images', file);
    }
    fetch('/admin/api/gallery', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(result => { if (result.success) location.reload(); });
});
function deleteImage(id) {
    if (confirm('Delete this image?')) {
        fetch('/admin/api/gallery/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => { if (result.success) location.reload(); });
    }
}
</script>
{% endblock %}
