<!-- Booking Modal -->
<div id="bookingModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeBookingModal()"></div>
    <div class="relative min-h-screen flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="sticky top-0 bg-white/95 backdrop-blur-sm z-10 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-2xl font-bold text-dark-900">
                    <i class="fas fa-calendar-plus text-gold-500 mr-2"></i>Book Your Session
                </h3>
                <button onclick="closeBookingModal()" class="text-gray-400 hover:text-dark-900 text-2xl transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="p-6 space-y-6">
                <!-- Hidden fields -->
                <input type="hidden" id="serviceId" name="serviceId" value="">
                <input type="hidden" id="therapistId" name="therapistId" value="">
                
                <!-- Personal Information -->
                <div class="space-y-4">
                    <h4 class="font-semibold text-dark-900 border-b border-gray-200 pb-2">Personal Information</h4>
                    
                    <div>
                        <label for="clientName" class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                        <input type="text" id="clientName" name="clientName" required 
                               class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none">
                    </div>
                    
                    <div>
                        <label for="clientPhone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                        <input type="tel" id="clientPhone" name="clientPhone" required placeholder="2547XXXXXXXX"
                               class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none">
                    </div>
                    
                    <div>
                        <label for="clientEmail" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="clientEmail" name="clientEmail" 
                               class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none">
                    </div>
                </div>
                
                <!-- Appointment Details -->
                <div class="space-y-4">
                    <h4 class="font-semibold text-dark-900 border-b border-gray-200 pb-2">Appointment Details</h4>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="appointmentDate" class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                            <input type="date" id="appointmentDate" name="appointmentDate" required
                                   class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none">
                        </div>
                        <div>
                            <label for="appointmentTime" class="block text-sm font-medium text-gray-700 mb-1">Time *</label>
                            <input type="time" id="appointmentTime" name="appointmentTime" required
                                   class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none">
                        </div>
                    </div>
                    
                    <div>
                        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Special Requests</label>
                        <textarea id="notes" name="notes" rows="2" 
                                  class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none"
                                  placeholder="Any specific requirements or preferences..."></textarea>
                    </div>
                </div>
                
                <!-- M-Pesa Payment -->
                <div class="space-y-4">
                    <h4 class="font-semibold text-dark-900 border-b border-gray-200 pb-2">M-Pesa Payment</h4>
                    
                    <div class="payment-card bg-gold-50 rounded-xl p-4 border-2 border-gold-200">
                        <div class="flex items-center justify-between mb-3">
                            <span class="font-medium text-dark-900">Till Number</span>
                            <span class="bg-gold-500 text-dark-900 px-4 py-1 rounded-full font-bold text-sm">
                                {{ till_number|default('XXXXXX') }}
                            </span>
                        </div>
                        <p class="text-sm text-gray-600 mb-3">
                            <i class="fas fa-info-circle text-gold-500 mr-1"></i>
                            Pay via M-Pesa Buy Goods &amp; Services, then enter the transaction code below
                        </p>
                        <div>
                            <label for="mpesaCode" class="block text-sm font-medium text-gray-700 mb-1">M-Pesa Transaction Code</label>
                            <input type="text" id="mpesaCode" name="mpesaCode" placeholder="e.g., QWERTY123"
                                   class="form-input w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gold-400 focus:ring-4 focus:ring-gold-400/10 transition-all outline-none">
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-gold-500 to-gold-600 text-dark-900 py-4 rounded-2xl font-bold text-lg hover:shadow-2xl hover:shadow-gold-500/30 transition-all duration-300 transform hover:scale-[1.02]">
                    <i class="fas fa-check-circle mr-2"></i>Confirm Booking
                </button>
                
                <p class="text-xs text-gray-400 text-center">
                    <i class="fas fa-lock mr-1"></i>
                    Your information is secure and will only be used for booking confirmation
                </p>
            </form>
        </div>
    </div>
</div>
